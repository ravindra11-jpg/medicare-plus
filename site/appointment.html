<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Appointment - MediCare Plus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="__THEME__">
  <header>
    <h2>MediCare Plus</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="appointment.html">Book Appointment</a>
    </nav>
  </header>

  <section class="form-box">
    <h1>Book an Appointment</h1>
    <form id="apptForm">
      <input type="text" placeholder="Full name" required>
      <input type="email" placeholder="Email" required>
      <select required>
        <option value="">Select department</option>
        <option>General Medicine</option>
        <option>Diagnostics</option>
        <option>Pediatrics</option>
        <option>Cardiology</option>
      </select>
      <input type="date" required>
      <button class="btn" type="submit">Submit</button>
    </form>
    <p id="msg"></p>
  </section>

  <footer>
    <p>&copy; 2026 MediCare Plus Clinic</p>
    <span class="badge">Version: __VERSION__ (__THEME__)</span>
  </footer>

  <script>
    document.getElementById('apptForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('msg').textContent = 'Request received. We will contact you shortly.';
      this.reset();
    });
  </script>
</body>
</html>
