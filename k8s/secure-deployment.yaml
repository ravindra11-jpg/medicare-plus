apiVersion: v1
kind: ServiceAccount
metadata:
  name: medicare-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-secure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicare-secure
  template:
    metadata:
      labels:
        app: medicare-secure
    spec:
      serviceAccountName: medicare-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: medicare
        image: DOCKERHUB_USER/medicare-plus:latest
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet:
            path: /health.html
            port: 8080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-secure-svc
spec:
  type: NodePort
  selector:
    app: medicare-secure
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30009
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medicare-allow-web-only
spec:
  podSelector:
    matchLabels:
      app: medicare-secure
  policyTypes: ["Ingress"]
  ingress:
  - ports:
    - port: 8080
