apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicare
  template:
    metadata:
      labels:
        app: medicare
    spec:
      containers:
      - name: medicare
        image: DOCKERHUB_USER/medicare-plus:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health.html
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-service
spec:
  type: NodePort
  selector:
    app: medicare
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30007
